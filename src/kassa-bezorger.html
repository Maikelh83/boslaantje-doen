<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bezorger · Boslaantje Doen</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
--green:#4A5D3D;--green-ink:#37472E;--terracotta:#9C6355;--terracotta-deep:#7F4F44;
--paper:#fff;--paper-2:#F5F3EF;--paper-line:#E4E0D6;--ink:#1B1B18;
--rood:#8A2B1E;
--font-body:'Roboto',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{font-family:var(--font-body);background:var(--paper-2);color:var(--ink);line-height:1.4;font-size:18px;min-height:100vh}
h1,h2,h3{font-weight:700;color:var(--green-ink)}
button{font-family:inherit;user-select:none}

#lockScreen{max-width:420px;margin:3.5rem auto;background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:2rem}
#lockScreen h1{text-align:center;font-size:1.4rem;margin-bottom:.4rem}
#lockScreen p{text-align:center;font-size:.9rem;color:#6b6a62}
#lockScreen input{width:100%;padding:1.1rem .9rem;border:1px solid var(--paper-line);border-radius:8px;font:inherit;font-size:1.15rem;margin:.6rem 0}
#lockScreen label{display:block;font-weight:700;font-size:.85rem;margin:1rem 0 .2rem}
#lockScreen button{width:100%;background:var(--terracotta);color:#fff;border:none;border-radius:8px;padding:1.1rem;font-weight:800;font-size:1.1rem;cursor:pointer;min-height:60px;margin-top:.6rem}
#lockScreen button:active{background:var(--terracotta-deep)}
#lockFout{color:var(--rood);font-size:.9rem;min-height:1.2em;margin-top:.5rem;text-align:center}

header{background:var(--green);padding:1rem 1.3rem;display:flex;align-items:center;justify-content:space-between}
header h1{color:#fff;font-size:1.3rem}
header .chauffeurTag{color:#fff;font-size:.85rem;opacity:.85}

main{padding:1.3rem;max-width:560px;margin:0 auto}

.leeg{background:#fff;border:2px dashed var(--paper-line);border-radius:14px;padding:2rem 1.2rem;text-align:center;color:#6b6a62;font-size:.95rem}
.ritKaart{background:#fff;border:2px solid var(--paper-line);border-radius:14px;padding:1.2rem;margin-bottom:1.1rem}
.ritKaart .adresRegel{font-size:1.05rem;font-weight:700;margin-bottom:.2rem}
.ritKaart .meta{font-size:.85rem;color:#6b6a62;margin-bottom:1rem}
.startBtn{width:100%;background:var(--terracotta);color:#fff;border:none;border-radius:10px;padding:1.2rem;font-weight:800;font-size:1.15rem;cursor:pointer;min-height:64px}
.startBtn:active{background:var(--terracotta-deep)}
.startBtn:disabled{background:#c9c2b6;cursor:default}

.stopTeller{text-align:center;font-weight:800;color:var(--green-ink);font-size:.95rem;margin-bottom:1rem}
.stopKaart{background:#fff;border-radius:16px;border:2px solid var(--paper-line);padding:1.5rem;text-align:center}
.stopKaart .adresGroot{font-size:1.7rem;font-weight:900;color:var(--green-ink);line-height:1.25;margin-bottom:.3rem}
.stopKaart .plaatsRegel{font-size:1.05rem;color:#4a4338;margin-bottom:1rem}
.stopKaart .klantNaam{font-size:1.15rem;font-weight:700;margin-bottom:1.1rem}
.stopKaart .opmerkingen{background:var(--paper-2);border-radius:10px;padding:.8rem 1rem;font-size:.92rem;color:#4a4338;text-align:left;margin-bottom:1.1rem}
.stopKaart .opmerkingen b{color:var(--green-ink)}

.knopStapel{display:flex;flex-direction:column;gap:.7rem}
.knopStapel a, .knopStapel button{display:flex;align-items:center;justify-content:center;gap:.5rem;text-decoration:none;border-radius:10px;padding:1.05rem;font-weight:800;font-size:1.05rem;min-height:60px;cursor:pointer;border:none}
.belBtn{background:var(--paper-2);color:var(--green-ink);border:2px solid var(--paper-line) !important}
.mapsBtn{background:var(--paper-2);color:var(--green-ink);border:2px solid var(--paper-line) !important}
.afgeleverdBtn{background:var(--green);color:#fff;font-size:1.2rem !important;min-height:68px !important}
.afgeleverdBtn:active{background:var(--green-ink)}
.afgeleverdBtn:disabled{background:#a9b39e;cursor:default}

.klaarScherm{text-align:center;padding:3.5rem 1.5rem}
.klaarScherm .vinkje{font-size:4rem;margin-bottom:1rem}
.klaarScherm h2{font-size:1.5rem;margin-bottom:.5rem}
.klaarScherm p{color:#6b6a62;margin-bottom:2rem}
.klaarScherm button{background:var(--terracotta);color:#fff;border:none;border-radius:10px;padding:1.1rem 1.6rem;font-weight:800;font-size:1.05rem;cursor:pointer;min-height:60px}

.foutMelding{color:var(--rood);text-align:center;font-size:.9rem;margin-top:1rem}
.verversBtn{display:block;margin:1rem auto 0;background:none;border:none;color:var(--green-ink);font-weight:700;text-decoration:underline;cursor:pointer;font-size:.9rem}

@media (max-width: 480px){
body{font-size:16px}
.stopKaart .adresGroot{font-size:1.45rem}
}
</style>
</head>
<body>

<div id="lockScreen">
<h1>Bezorger</h1>
<p>Alleen voor bezorgers — voer het wachtwoord en je naam in.</p>
<label for="wachtwoordInput">Wachtwoord</label>
<input type="password" id="wachtwoordInput" placeholder="Wachtwoord" autocomplete="off">
<label for="naamInput">Jouw naam</label>
<input type="text" id="naamInput" placeholder="Bijv. Kevin" autocomplete="off">
<button type="button" id="ontgrendelBtn">Ontgrendelen</button>
<div id="lockFout"></div>
</div>

<div id="app" style="display:none">
<header>
<h1>Bezorger</h1>
<span class="chauffeurTag" id="chauffeurTag"></span>
</header>
<main>
<div id="lijstScherm"></div>
<div id="stopScherm" style="display:none"></div>
<div id="klaarScherm" style="display:none" class="klaarScherm">
<div class="vinkje">🎉</div>
<h2>Rit Afgerond</h2>
<p>Alle stops zijn afgeleverd. Terug naar zaak!</p>
<button type="button" id="terugNaarLijstBtn">Nieuwe rit ophalen</button>
</div>
<div class="foutMelding" id="foutMelding"></div>
</main>
</div>

<script>
(function(){
var LOCAL_KEY_NAAM = 'bd_bezorger_naam';
var wachtwoordInput = document.getElementById('wachtwoordInput');
var naamInput = document.getElementById('naamInput');
var ontgrendelBtn = document.getElementById('ontgrendelBtn');
var lockFout = document.getElementById('lockFout');
var huidigWachtwoord = null;
var huidigeNaam = null;
var huidigeRit = null; // { ritId, status, stops: [...] }
var pollTimer = null;

try {
var opgeslagenNaam = localStorage.getItem(LOCAL_KEY_NAAM);
if (opgeslagenNaam) naamInput.value = opgeslagenNaam;
} catch(e){}

// Zelfde wachtwoord-check + sessionStorage-sleutel als de rest van
// /kassa-* (kassa.html, kassa-keuken.html, kassa-ritten.html, enz.): één
// keer inloggen in de balie/bezorger-omgeving volstaat. De naam wordt
// apart in localStorage bewaard (blijft dus ook na verversen/herstart
// van de telefoon staan, i.t.t. sessionStorage) - dit project heeft geen
// individueel bezorger-account-systeem, dus deze naam ís de driver_id.
function controleerWachtwoord(wachtwoord, naam){
if (!naam) { lockFout.textContent = 'Vul je naam in.'; return; }
lockFout.textContent = 'Controleren...';
fetch('/api/loyalty-opzoeken?wachtwoord=' + encodeURIComponent(wachtwoord) + '&code=___check___')
.then(function(res){
if (res.status === 401) { lockFout.textContent = 'Onjuist wachtwoord.'; return; }
if (res.status === 500) {
return res.json().then(function(d){ lockFout.textContent = (d && d.error) || 'Kon niet inloggen.'; });
}
huidigWachtwoord = wachtwoord;
huidigeNaam = naam;
try {
sessionStorage.setItem('bd_loyalty_pw', wachtwoord);
localStorage.setItem(LOCAL_KEY_NAAM, naam);
} catch(e){}
document.getElementById('lockScreen').style.display = 'none';
document.getElementById('app').style.display = 'block';
document.getElementById('chauffeurTag').textContent = naam;
laden();
})
.catch(function(){ lockFout.textContent = 'Kon geen verbinding maken.'; });
}
ontgrendelBtn.addEventListener('click', function(){ controleerWachtwoord(wachtwoordInput.value, naamInput.value.trim()); });
[wachtwoordInput, naamInput].forEach(function(inp){
inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') controleerWachtwoord(wachtwoordInput.value, naamInput.value.trim()); });
});
var opgeslagenPw = null;
try { opgeslagenPw = sessionStorage.getItem('bd_loyalty_pw'); } catch(e){}
if (opgeslagenPw && naamInput.value.trim()) controleerWachtwoord(opgeslagenPw, naamInput.value.trim());

function toonFout(tekst){
document.getElementById('foutMelding').textContent = tekst || '';
}

function adresTekst(s){
var stuk = (s.adres || '') + (s.postcode ? (', ' + s.postcode) : '') + (s.plaats ? (' ' + s.plaats) : '');
return stuk.trim() || 'Geen adres bekend';
}

function volgendeOpenstaandeStop(rit){
if (!rit || !rit.stops) return null;
return rit.stops.find(function(s){ return s.bezorgStatus !== 'DELIVERED'; }) || null;
}

// Startpunt: kijk of deze chauffeur al een rit onderweg heeft staan (bijv.
// na het verversen van de pagina) - zo ja, spring direct door naar de
// huidige stop. Zo niet, toon de lijst met klaarstaande ritten.
function laden(){
toonFout('');
fetch('/api/bezorger-ritten?wachtwoord=' + encodeURIComponent(huidigWachtwoord) + '&chauffeur=' + encodeURIComponent(huidigeNaam))
.then(function(res){ return res.json().then(function(d){ return { ok: res.ok, data: d }; }); })
.then(function(r){
if (!r.ok) { toonFout((r.data && r.data.error) || 'Kon niet laden.'); return; }
if (r.data.actieveRit) {
huidigeRit = r.data.actieveRit;
toonStopScherm();
} else {
toonLijstScherm(r.data.beschikbareRitten || []);
}
})
.catch(function(){ toonFout('Kon geen verbinding maken.'); });
}

function wisselScherm(naam){
['lijstScherm', 'stopScherm', 'klaarScherm'].forEach(function(id){
document.getElementById(id).style.display = (id === naam) ? 'block' : 'none';
});
}

function toonLijstScherm(ritten){
wisselScherm('lijstScherm');
var host = document.getElementById('lijstScherm');
host.innerHTML = '';
if (ritten.length === 0) {
host.innerHTML = '<div class="leeg">Geen ritten klaarstaand — even geduld tot de zaak er een klaarzet.</div><button type="button" class="verversBtn" id="ververs1">Ververs</button>';
document.getElementById('ververs1').addEventListener('click', laden);
return;
}
ritten.forEach(function(rit){
var kaart = document.createElement('div');
kaart.className = 'ritKaart';
kaart.innerHTML =
'<div class="adresRegel">' + (rit.eersteAdres || 'Rit met ' + rit.aantalStops + ' stop(s)') + '</div>' +
'<div class="meta">' + rit.aantalStops + ' stop' + (rit.aantalStops === 1 ? '' : 's') + '</div>' +
'<button type="button" class="startBtn">🚀 START DEZE RIT</button>';
var btn = kaart.querySelector('.startBtn');
btn.addEventListener('click', function(){ startRit(rit.ritId, btn); });
host.appendChild(kaart);
});
var verversBtn = document.createElement('button');
verversBtn.type = 'button';
verversBtn.className = 'verversBtn';
verversBtn.textContent = 'Ververs';
verversBtn.addEventListener('click', laden);
host.appendChild(verversBtn);
}

// '1-Druk-op-de-knop': koppelt de hele batch aan deze chauffeur, zet alles
// op IN_TRANSIT, en springt direct door naar stop 1.
function startRit(ritId, btn){
btn.disabled = true;
btn.textContent = 'Starten...';
fetch('/api/bezorger-ritten?wachtwoord=' + encodeURIComponent(huidigWachtwoord), {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ actie: 'start', ritId: ritId, chauffeurNaam: huidigeNaam }),
})
.then(function(res){ return res.json().then(function(d){ return { ok: res.ok, data: d }; }); })
.then(function(r){
if (!r.ok) { toonFout((r.data && r.data.error) || 'Starten mislukt.'); btn.disabled = false; btn.textContent = '🚀 START DEZE RIT'; return; }
huidigeRit = r.data.rit;
toonStopScherm();
})
.catch(function(){ toonFout('Kon geen verbinding maken.'); btn.disabled = false; btn.textContent = '🚀 START DEZE RIT'; });
}

function toonStopScherm(){
var stop = volgendeOpenstaandeStop(huidigeRit);
if (!stop) { wisselScherm('klaarScherm'); return; }
wisselScherm('stopScherm');
var host = document.getElementById('stopScherm');
var totaalStops = huidigeRit.stops.length;
var afgeleverdAantal = huidigeRit.stops.filter(function(s){ return s.bezorgStatus === 'DELIVERED'; }).length;

var mapsUrl = 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(adresTekst(stop));
var telUrl = stop.klantTelefoon ? ('tel:' + stop.klantTelefoon.replace(/\s+/g, '')) : null;

host.innerHTML =
'<div class="stopTeller">Stop ' + (afgeleverdAantal + 1) + ' van ' + totaalStops + '</div>' +
'<div class="stopKaart">' +
'<div class="adresGroot">' + (stop.adres || 'Onbekend adres') + '</div>' +
'<div class="plaatsRegel">' + ((stop.postcode || '') + ' ' + (stop.plaats || '')).trim() + '</div>' +
'<div class="klantNaam">' + (stop.klantNaam || 'Onbekende klant') + '</div>' +
(stop.opmerkingen ? ('<div class="opmerkingen"><b>Opmerking:</b> ' + stop.opmerkingen + '</div>') : '') +
'<div class="knopStapel">' +
(telUrl ? ('<a class="belBtn" href="' + telUrl + '">📞 Bel klant</a>') : '') +
'<a class="mapsBtn" href="' + mapsUrl + '" target="_blank" rel="noopener">📍 Open in Google Maps</a>' +
'<button type="button" class="afgeleverdBtn" id="afgeleverdBtn">✅ AFGELEVERD</button>' +
'</div>' +
'</div>';

document.getElementById('afgeleverdBtn').addEventListener('click', function(){ markeerAfgeleverd(stop.orderId, this); });
}

function markeerAfgeleverd(orderId, btn){
btn.disabled = true;
btn.textContent = 'Bezig...';
toonFout('');
fetch('/api/bezorger-ritten?wachtwoord=' + encodeURIComponent(huidigWachtwoord), {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ actie: 'afgeleverd', orderId: orderId }),
})
.then(function(res){ return res.json().then(function(d){ return { ok: res.ok, data: d }; }); })
.then(function(r){
if (!r.ok) { toonFout((r.data && r.data.error) || 'Kon niet bijwerken.'); btn.disabled = false; btn.textContent = '✅ AFGELEVERD'; return; }
huidigeRit = r.data.rit;
if (r.data.ritVoltooid) {
wisselScherm('klaarScherm');
} else {
toonStopScherm();
}
})
.catch(function(){ toonFout('Kon geen verbinding maken.'); btn.disabled = false; btn.textContent = '✅ AFGELEVERD'; });
}

document.getElementById('terugNaarLijstBtn').addEventListener('click', function(){
huidigeRit = null;
laden();
});
})();
</script>
</body>
</html>
