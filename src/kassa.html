<!DOCTYPE html>
<html lang="nl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Kassa · Boslaantje Doen</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
:root{
  --green:#4A5D3D;--green-ink:#37472E;--terracotta:#9C6355;--terracotta-deep:#7F4F44;
  --paper:#fff;--paper-2:#F5F3EF;--paper-line:#E4E0D6;--ink:#1B1B18;
  --font-body:'Roboto',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{touch-action:manipulation}
body{font-family:var(--font-body);background:var(--paper-2);color:var(--ink);line-height:1.4;font-size:16px}
h1,h2,h3{font-weight:700;color:var(--green-ink)}
button{font-family:inherit;user-select:none}
header{background:var(--green);padding:1rem 1.3rem;display:flex;align-items:center;justify-content:space-between}
header h1{color:#fff;font-size:1.35rem}
header a{color:#fff;text-decoration:none;font-weight:700;font-size:.9rem}

#lockScreen{max-width:400px;margin:4rem auto;background:#fff;border:1px solid var(--paper-line);border-radius:10px;padding:2rem}
#lockScreen h1{text-align:center}
#lockScreen p{text-align:center}
#lockScreen input{width:100%;padding:1rem .9rem;border:1px solid var(--paper-line);border-radius:8px;font:inherit;font-size:1.1rem;margin:1rem 0}
#lockScreen button{width:100%;background:var(--terracotta);color:#fff;border:none;border-radius:8px;padding:1rem;font-weight:800;font-size:1.05rem;cursor:pointer;min-height:56px}
#lockScreen button:active{background:var(--terracotta-deep)}
#lockFout{color:#8a2b1e;font-size:.9rem;min-height:1.2em;margin-top:.5rem;text-align:center}

#layout{display:flex;height:calc(100vh - 66px);overflow:hidden}

/* --- categorieën: vaste kolom links, grote tikvlakken --- */
#categorieKolom{flex:0 0 220px;background:var(--green);overflow-y:auto}
.categorieItem{display:block;width:100%;text-align:left;background:none;border:none;border-bottom:1px solid rgba(255,255,255,.14);color:#fff;font-weight:700;font-size:1rem;padding:1.1rem 1.2rem;min-height:60px;cursor:pointer}
.categorieItem.actief{background:var(--terracotta)}
.categorieItem:active{background:rgba(255,255,255,.18)}

#menuKolom{flex:1 1 auto;overflow-y:auto;padding:1.2rem}

.productgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:.9rem}
.productknop{background:#fff;border:1px solid var(--paper-line);border-radius:12px;padding:1.2rem;text-align:left;cursor:pointer;min-height:104px;display:flex;flex-direction:column;justify-content:space-between}
.productknop:active{background:var(--paper-2);border-color:var(--terracotta)}
.productknop .naam{font-weight:700;font-size:1.05rem;color:var(--green-ink);line-height:1.28}
.productknop .prijs{font-weight:800;font-size:1.15rem;margin-top:.6rem;color:var(--terracotta-deep)}

#cartKolom{flex:0 0 420px;max-width:44%;background:#fff;border-left:1px solid var(--paper-line);display:flex;flex-direction:column;overflow:hidden}

#cartLijst{flex:1;overflow-y:auto;padding:1.1rem}
.cartRegel{display:flex;justify-content:space-between;align-items:flex-start;gap:.6rem;padding:.85rem 0;border-bottom:1px solid var(--paper-line)}
.cartRegel .info{flex:1}
.cartRegel .naam{font-weight:700;font-size:1rem}
.cartRegel .extras{font-size:.85rem;color:#6b6a62;margin-top:.15rem}
.cartRegel .subtotaal{font-weight:800;font-size:1.02rem;white-space:nowrap}
.stepper{display:flex;align-items:center;gap:.6rem;margin-top:.5rem}
.stepper button{width:42px;height:42px;border-radius:8px;border:1px solid var(--paper-line);background:var(--paper-2);font-weight:800;font-size:1.15rem;cursor:pointer}
.stepper button:active{background:var(--paper-line)}
.stepper span{min-width:1.6rem;text-align:center;font-weight:800;font-size:1.05rem}
.verwijder{color:#8a2b1e;font-size:.85rem;background:none;border:none;cursor:pointer;padding:.5rem 0 0;margin-top:.2rem;font-weight:700}

#loyaliteitBlok{border-top:1px solid var(--paper-line);padding:1.1rem}
#loyaliteitBlok label{display:block;font-size:.85rem;font-weight:700;color:var(--green-ink);margin-bottom:.35rem}
#loyaliteitBlok input{width:100%;padding:.85rem .8rem;border:1px solid var(--paper-line);border-radius:8px;font:inherit;font-size:1rem;margin-bottom:.5rem}
.klantkaart{background:var(--paper-2);border-radius:8px;padding:.8rem;font-size:.9rem;margin-bottom:.5rem}
.klantkaart .rij{display:flex;justify-content:space-between;margin-top:.2rem}
.klein{font-size:.82rem;color:#6b6a62;background:none;border:none;cursor:pointer;text-decoration:underline;padding:.4rem 0 0}

/* --- Levering: Afhalen/Bezorgen-toggle + adresvelden (juli 2026, op verzoek
     van Maikel: 'aan de deur betalen' mag alleen nog via de kassa, niet meer
     via de openbare bestelsite - dit is de plek waar personeel dat voor een
     telefonische bestelling kan aanmaken). --- */
#leveringKeuzeBlok{border-top:1px solid var(--paper-line);padding:1.1rem 1.1rem 0}
#leveringKeuzeBlok .label{font-size:.85rem;font-weight:700;color:var(--green-ink);margin-bottom:.6rem}
.leveringKnoppenRij{display:flex;gap:.7rem;margin-bottom:.9rem}
.levering-keuze-btn{flex:1;background:var(--paper-2);color:var(--green-ink);border:1.5px solid var(--paper-line);border-radius:8px;padding:.8rem .5rem;font-weight:700;font-size:.92rem;cursor:pointer;min-height:52px}
.levering-keuze-btn.actief{background:var(--terracotta);color:#fff;border-color:var(--terracotta)}
.levering-keuze-btn:active{background:var(--terracotta-deep);color:#fff}
#bezorgVeldenKassa{display:none;margin-bottom:.9rem}
#bezorgVeldenKassa label{display:block;font-size:.8rem;font-weight:700;color:var(--green-ink);margin-bottom:.3rem}
#bezorgVeldenKassa input{width:100%;padding:.7rem .8rem;border:1px solid var(--paper-line);border-radius:8px;font:inherit;font-size:.95rem;margin-bottom:.6rem}
#bezorgVeldenKassa .postcodePlaatsRij{display:flex;gap:.6rem}
#bezorgVeldenKassa .postcodePlaatsRij > div{flex:1}
.bezorgKassaMelding{font-size:.85rem;color:#8a2b1e;min-height:1.1em;margin-bottom:.6rem}

#afrekenBlok{border-top:1px solid var(--paper-line);padding:1.1rem}
#totaalRij{display:flex;justify-content:space-between;font-size:1.35rem;font-weight:800;margin-bottom:.9rem;color:var(--green-ink)}
button.primair{background:var(--terracotta);color:#fff;border:none;border-radius:8px;padding:1.1rem;font-weight:800;cursor:pointer;width:100%;font-size:1.15rem;min-height:60px}
button.primair:active{background:var(--terracotta-deep)}
button.primair:disabled{background:#c9beb8;cursor:not-allowed}
button.secundair{background:var(--paper-2);color:var(--green-ink);border:1px solid var(--paper-line);border-radius:8px;padding:.7rem 1rem;font-weight:700;cursor:pointer;font-size:.92rem;min-height:48px}
button.secundair:active{background:var(--paper-line)}
.melding{font-size:.88rem;min-height:1.2em;margin-top:.6rem}
.melding.fout{color:#8a2b1e}
.melding.ok{color:var(--green-ink)}
.leegCart{color:#6b6a62;font-size:.92rem;text-align:center;padding:2.4rem 0}

/* --- extras-modal: grote keuzeknoppen i.p.v. radio/checkbox --- */
#modalOverlay{position:fixed;inset:0;background:rgba(27,27,24,.55);display:none;align-items:center;justify-content:center;z-index:50;padding:1rem}
#modalOverlay.actief{display:flex}
#modalKaart{background:#fff;border-radius:14px;padding:1.6rem;max-width:520px;width:100%;max-height:88vh;overflow-y:auto}
#modalKaart h3{font-size:1.2rem;margin-bottom:1.1rem}
.extraGroep{margin-bottom:1.3rem}
.extraGroep .groepnaam{font-weight:700;font-size:.98rem;margin-bottom:.6rem;color:var(--green-ink)}
.extraGroep .opties{display:flex;flex-wrap:wrap;gap:.7rem}
.optieBtn{flex:1 1 auto;min-width:130px;padding:1rem .9rem;border:2px solid var(--paper-line);border-radius:12px;background:#fff;text-align:center;font-weight:700;font-size:1rem;cursor:pointer;color:var(--green-ink);min-height:56px}
.optieBtn .optiePrijs{display:block;font-size:.85rem;font-weight:600;margin-top:.25rem;opacity:.85}
.optieBtn.geselecteerd{border-color:var(--terracotta);background:var(--terracotta);color:#fff}
.optieBtn:active{border-color:var(--terracotta-deep)}

.modalStepper{display:flex;align-items:center;gap:.7rem;margin:1rem 0 1.3rem}
.modalStepper span.label{font-weight:700;font-size:.95rem;margin-right:.3rem}
.modalStepper button{width:52px;height:52px;border-radius:10px;border:1px solid var(--paper-line);background:var(--paper-2);font-weight:800;font-size:1.3rem;cursor:pointer}
.modalStepper button:active{background:var(--paper-line)}
.modalStepper .aantal{min-width:2rem;text-align:center;font-weight:800;font-size:1.2rem}

/* --- afreken: pin/contant-keuze + numpad blijven zichtbaar in de
     winkelwagen-kolom (Maikel's wens: net als bij andere kassasystemen
     staat het numpad vast op het hoofdscherm, niet als losse full-screen
     stap). Alleen het eindresultaat (te pinnen bedrag / wisselgeld)
     verschijnt nog groot in beeld via #betaalOverlay hieronder. --- */
#betaalInline{display:none;margin-top:.9rem;padding-top:.9rem;border-top:1px dashed var(--paper-line)}
#betaalInline .label{font-size:.92rem;font-weight:700;color:var(--green-ink);margin-bottom:.6rem}
#betaalLoyaliteitInfo{font-size:.85rem;color:var(--green-ink);margin-bottom:.7rem;min-height:1.1em}
.betaalKeuzeKnoppenInline{display:flex;gap:.7rem}
.betaalKeuzeKnoppenInline button{flex:1;background:var(--terracotta);color:#fff;border:none;border-radius:8px;padding:.85rem;font-weight:800;font-size:1rem;cursor:pointer;min-height:52px}
.betaalKeuzeKnoppenInline button:active{background:var(--terracotta-deep)}
#inlineContant{display:none}
#numpadWeergave{font-size:2.2rem;font-weight:900;color:var(--green-ink);margin:.2rem 0;text-align:center}
#wisselgeldRij{font-size:1rem;font-weight:700;color:var(--green-ink);min-height:1.4em;margin-bottom:.7rem;text-align:center}
#wisselgeldRij.nogNiet{opacity:.7;font-weight:500}
.numpadSnel{display:flex;gap:.5rem;margin-bottom:.8rem;flex-wrap:wrap}
.numpadSnel button{flex:1 1 auto;background:var(--paper-2);color:var(--green-ink);border:1px solid var(--paper-line);border-radius:8px;font-weight:700;font-size:.85rem;padding:.5rem .4rem;cursor:pointer;min-height:42px}
.numpadSnel button:active{background:var(--paper-line)}
.numpad{display:grid;grid-template-columns:repeat(3,1fr);gap:.5rem;margin-bottom:.9rem}
.numpad button{background:var(--paper-2);color:var(--green-ink);border:1px solid var(--paper-line);border-radius:8px;font-weight:800;font-size:1.15rem;min-height:48px;cursor:pointer}
.numpad button:active{background:var(--paper-line)}
.betaalKnopRij{display:flex;gap:.6rem}
.betaalKnopRij button{flex:1;border-radius:8px;font-weight:800;font-size:.92rem;cursor:pointer;min-height:46px;border:none}
#contantTerugBtn{background:var(--paper-2);color:var(--green-ink);border:1px solid var(--paper-line)}
#contantTerugBtn:active{background:var(--paper-line)}
#contantBevestigBtn{background:var(--terracotta);color:#fff}
#contantBevestigBtn:active{background:var(--terracotta-deep)}
#contantBevestigBtn:disabled{background:#c9beb8;cursor:not-allowed}

/* --- afreken-eindscherm: alleen het te betalen/wisselgeld-bedrag groot in beeld --- */
#betaalOverlay{position:fixed;inset:0;background:var(--green-ink);display:none;align-items:center;justify-content:center;flex-direction:column;color:#fff;z-index:60;text-align:center;padding:2rem}
#betaalOverlay.actief{display:flex}
#betaalOverlay .label{font-size:1.2rem;opacity:.85}
#betaalOverlay .bedrag{font-size:5.5rem;font-weight:900;margin:.5rem 0 1.3rem}
#betaalOverlay .loyaliteitInfo{font-size:1.05rem;margin-bottom:1.8rem;opacity:.95;max-width:32rem}
#betaalOverlay button{background:#fff;color:var(--green-ink);border:none;border-radius:10px;padding:1.2rem 2.6rem;font-weight:800;font-size:1.15rem;cursor:pointer;min-height:64px}

@media (max-width: 900px){
  #layout{flex-direction:column;height:auto;overflow:visible}
  #categorieKolom{flex:none;width:100%;display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden}
  .categorieItem{border-bottom:none;border-right:1px solid rgba(255,255,255,.14);white-space:nowrap;flex:0 0 auto}
  #cartKolom{max-width:100%;flex:none;border-left:none;border-top:1px solid var(--paper-line)}
}
</style>
</head>
<body>

<div id="lockScreen">
  <h1 style="font-size:1.3rem;margin-bottom:.4rem">Kassa — personeel</h1>
  <p style="font-size:.9rem;color:#6b6a62">Alleen voor personeel — voer het wachtwoord in.</p>
  <input type="password" id="wachtwoordInput" placeholder="Wachtwoord" autocomplete="off">
  <button type="button" id="ontgrendelBtn">Ontgrendelen</button>
  <div id="lockFout"></div>
</div>

<div id="scherm" style="display:none">
  <header>
    <h1>Kassa</h1>
    <div style="display:flex;gap:1rem">
      <a href="/kassa-keuken">Keuken &rarr;</a>
<a href="/kassa-zakelijke-klanten">Zakelijk &rarr;</a>
<a href="/kassa-bezorgzone">Bezorgzone &rarr;</a>
<a href="/kassa-ritten">Ritten &rarr;</a>
<a href="/kassa-bezorger">Bezorger &rarr;</a>
<a href="/kassa-personeel">Personeel &rarr;</a>
      <a href="/dashboard">&larr; Dashboard</a>
    </div>
  </header>

  <div id="layout">
    <div id="categorieKolom"></div>

    <div id="menuKolom">
      <div class="productgrid" id="productgridHost"></div>
    </div>

    <div id="cartKolom">
      <div id="cartLijst"><div class="leegCart">Nog niets toegevoegd.</div></div>

      <div id="loyaliteitBlok">
        <label for="loyCode">Spaarkaart-code (optioneel)</label>
        <input type="text" id="loyCode" placeholder="bijv. K7QXM4RT" autocomplete="off">
        <button type="button" class="secundair" id="loyZoekBtn" style="width:100%">Koppelen</button>
        <div class="melding" id="loyMelding"></div>
        <div id="loyKlantkaart" style="display:none"></div>
      </div>

      <div id="leveringKeuzeBlok">
        <div class="label">Levering</div>
        <div class="leveringKnoppenRij">
          <button type="button" class="levering-keuze-btn actief" data-levering="kassa">Afhalen aan de balie</button>
          <button type="button" class="levering-keuze-btn" data-levering="bezorgen">Bezorgen (aan de deur betalen)</button>
        </div>
        <div id="bezorgVeldenKassa">
          <label for="kassaBezorgNaam">Naam</label>
          <input type="text" id="kassaBezorgNaam" autocomplete="off">
          <label for="kassaBezorgTelefoon">Telefoon</label>
          <input type="tel" id="kassaBezorgTelefoon" autocomplete="off">
          <label for="kassaBezorgAdres">Adres (straat + huisnummer)</label>
          <input type="text" id="kassaBezorgAdres" autocomplete="off">
          <div class="postcodePlaatsRij">
            <div>
              <label for="kassaBezorgPostcode">Postcode</label>
              <input type="text" id="kassaBezorgPostcode" autocomplete="off">
            </div>
            <div>
              <label for="kassaBezorgPlaats">Plaats</label>
              <input type="text" id="kassaBezorgPlaats" value="Veenendaal" autocomplete="off">
            </div>
          </div>
          <div class="bezorgKassaMelding" id="bezorgKassaMelding"></div>
        </div>
      </div>

      <div id="afrekenBlok">
        <div id="totaalRij"><span>Totaal</span><span id="totaalBedrag">€0,00</span></div>
        <button type="button" class="primair" id="afrekenBtn" disabled>Afrekenen</button>
        <div class="melding fout" id="afrekenMelding"></div>

        <!-- Verschijnt na een geslaagde afrekening (kassa-order.js is dan al
             klaar, de verkoop staat vast) i.p.v. de knop hierboven — dit gaat
             alleen nog over hoe het geld ontvangen wordt. Bij een
             bezorgorder wordt dit blok overgeslagen: daar wordt pas aan de
             deur betaald, niet aan de balie - zie toonBezorgBevestiging(). -->
        <div id="betaalInline">
          <div id="inlineKeuze">
            <div class="label">Hoe wordt er betaald?</div>
            <div id="betaalLoyaliteitInfo"></div>
            <div class="betaalKeuzeKnoppenInline">
              <button type="button" id="kiesPinBtn">Pin</button>
              <button type="button" id="kiesContantBtn">Contant</button>
            </div>
          </div>

          <div id="inlineContant">
            <div class="label">Ontvangen bedrag</div>
            <div id="numpadWeergave">€0,00</div>
            <div id="wisselgeldRij" class="nogNiet">Totaal: €0,00</div>
            <div class="numpadSnel" id="numpadSnelHost"></div>
            <div class="numpad">
              <button type="button" data-cijfer="1">1</button>
              <button type="button" data-cijfer="2">2</button>
              <button type="button" data-cijfer="3">3</button>
              <button type="button" data-cijfer="4">4</button>
              <button type="button" data-cijfer="5">5</button>
              <button type="button" data-cijfer="6">6</button>
              <button type="button" data-cijfer="7">7</button>
              <button type="button" data-cijfer="8">8</button>
              <button type="button" data-cijfer="9">9</button>
              <button type="button" id="numpadWisBtn">C</button>
              <button type="button" data-cijfer="0">0</button>
              <button type="button" id="numpadBackBtn">&larr;</button>
            </div>
            <div class="betaalKnopRij">
              <button type="button" id="contantTerugBtn">Terug</button>
              <button type="button" id="contantBevestigBtn" disabled>Bevestigen</button>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Extras-keuze modal -->
<div id="modalOverlay">
  <div id="modalKaart">
    <h3 id="modalProductNaam"></h3>
    <div id="modalExtrasHost"></div>
    <div class="modalStepper">
      <span class="label">Aantal:</span>
      <button type="button" id="modalMin">-</button>
      <span class="aantal" id="modalAantal">1</span>
      <button type="button" id="modalPlus">+</button>
    </div>
    <div class="melding fout" id="modalMelding"></div>
    <button type="button" class="primair" id="modalToevoegenBtn">Toevoegen</button>
    <button type="button" class="secundair" id="modalAnnulerenBtn" style="width:100%;margin-top:.6rem">Annuleren</button>
  </div>
</div>

<!-- Afreken-eindscherm: het intoetsen (pin/contant kiezen, numpad) gebeurt
     nu in de winkelwagen-kolom hiernaast — dit scherm toont alleen nog
     groot het eindresultaat (te pinnen bedrag of wisselgeld), of bij een
     bezorgorder de bevestiging dat die is aangemaakt. De order zelf is op
     dit punt al afgerond via /api/kassa-order. -->
<div id="betaalOverlay">
  <div class="label" id="betaalEindLabel">Te pinnen</div>
  <div class="bedrag" id="betaalEindBedrag">€0,00</div>
  <div class="loyaliteitInfo" id="betaalOverlayLoyaliteitInfo"></div>
  <button type="button" id="volgendeKlantBtn">Volgende klant</button>
</div>

<script>
(function(){
  var wachtwoordInput = document.getElementById('wachtwoordInput');
  var ontgrendelBtn = document.getElementById('ontgrendelBtn');
  var lockFout = document.getElementById('lockFout');
  var huidigWachtwoord = null;
  var catalogus = null;
  var productMap = new Map();

  function euro(n){ return '€' + (Number(n)||0).toFixed(2).replace('.', ','); }

  // --- Zelfde wachtwoord-check-truc als kassa-loyaliteit.html: dezelfde
  // personeelsomgeving, dus hetzelfde wachtwoord (STAFF_LOYALTY_PASSWORD) en
  // dezelfde sessionStorage-sleutel, zodat je niet twee keer hoeft in te loggen.
  function controleerWachtwoord(wachtwoord){
    lockFout.textContent = 'Controleren...';
    fetch('/api/loyalty-opzoeken?wachtwoord=' + encodeURIComponent(wachtwoord) + '&code=___check___')
      .then(function(res){
        if (res.status === 401) { lockFout.textContent = 'Onjuist wachtwoord.'; return; }
        if (res.status === 500) {
          return res.json().then(function(d){ lockFout.textContent = (d && d.error) || 'Kon niet inloggen.'; });
        }
        huidigWachtwoord = wachtwoord;
        try { sessionStorage.setItem('bd_loyalty_pw', wachtwoord); } catch(e){}
        document.getElementById('lockScreen').style.display = 'none';
        document.getElementById('scherm').style.display = 'block';
        laadMenu();
      })
      .catch(function(){ lockFout.textContent = 'Kon geen verbinding maken.'; });
  }
  ontgrendelBtn.addEventListener('click', function(){ controleerWachtwoord(wachtwoordInput.value); });
  wachtwoordInput.addEventListener('keydown', function(e){ if (e.key === 'Enter') controleerWachtwoord(wachtwoordInput.value); });
  var opgeslagen = null;
  try { opgeslagen = sessionStorage.getItem('bd_loyalty_pw'); } catch(e){}
  if (opgeslagen) controleerWachtwoord(opgeslagen);

  // --- Menu laden ---
  function laadMenu(){
    fetch('/producten.json')
      .then(function(res){ return res.json(); })
      .then(function(data){
        catalogus = data;
        catalogus.categorieen.forEach(function(cat){
          cat.producten.forEach(function(p){ productMap.set(p.id, p); });
        });
        bouwCategorieen();
        toonCategorie(catalogus.categorieen[0].naam);
      })
      .catch(function(){
        document.getElementById('productgridHost').innerHTML = '<div class="leegCart">Kon het menu niet laden.</div>';
      });
  }

  function bouwCategorieen(){
    var host = document.getElementById('categorieKolom');
    host.innerHTML = '';
    catalogus.categorieen.forEach(function(cat, i){
      var item = document.createElement('button');
      item.type = 'button';
      item.className = 'categorieItem' + (i === 0 ? ' actief' : '');
      item.textContent = cat.naam;
      item.addEventListener('click', function(){
        host.querySelectorAll('.categorieItem').forEach(function(t){ t.classList.remove('actief'); });
        item.classList.add('actief');
        toonCategorie(cat.naam);
      });
      host.appendChild(item);
    });
  }

  function toonCategorie(naam){
    var cat = catalogus.categorieen.find(function(c){ return c.naam === naam; });
    var host = document.getElementById('productgridHost');
    host.innerHTML = '';
    if (!cat) return;
    cat.producten.forEach(function(p){
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'productknop';
      btn.innerHTML = '<span class="naam">' + p.naam + '</span><span class="prijs">' + euro(p.prijs) + '</span>';
      btn.addEventListener('click', function(){ productKlik(p); });
      host.appendChild(btn);
    });
  }

  // --- Winkelwagen ---
  // Cart-regels worden bijgehouden als array van { id, naam, extras: {groepId: [optieIndex,...]}, extraOmschrijving, prijsPerStuk, aantal }.
  // Regels met verschillende extra-keuzes voor hetzelfde product blijven bewust
  // aparte regels (bijv. patat met/zonder saus zijn niet samen te voegen).
  var cart = [];

  function sleutelVoorRegel(id, extras){
    return id + '::' + JSON.stringify(extras || {});
  }

  function productKlik(product){
    if (Array.isArray(product.kassaExtras) && product.kassaExtras.length > 0) {
      openModal(product);
    } else {
      voegToeAanCart(product, {}, 1);
    }
  }

  // Berekent prijs + omschrijving op basis van de exacte CashDesk-keuzegroepen
  // (product.kassaExtras) en een eventuele verplichte vaste toeslag
  // (product.kassaToeslag, bv. Verpakkingskosten bij Bittergarnituur).
  // selecties heeft de vorm { groepId: [optieIndex, ...] } — ook single-select
  // groepen gebruiken een array (met 0 of 1 element), zodat single- en
  // multi-select-groepen door dezelfde code afgehandeld kunnen worden.
  function berekenPrijsEnOmschrijving(product, selecties){
    var basisPrijs = product.prijs;
    var extraPrijs = 0;
    var omschrijvingen = [];
    (product.kassaExtras || []).forEach(function(groep){
      var idxs = selecties[groep.id] || [];
      idxs.forEach(function(idx){
        var optie = groep.opties[idx];
        if (!optie) return;
        if (groep.vervangtPrijs) {
          basisPrijs = optie.prijs;
        } else {
          extraPrijs += optie.prijs || 0;
        }
        omschrijvingen.push(optie.naam);
      });
    });
    if (product.kassaToeslag) {
      extraPrijs += product.kassaToeslag.prijs || 0;
      omschrijvingen.push(product.kassaToeslag.naam);
    }
    return {
      prijsPerStuk: Math.round((basisPrijs + extraPrijs) * 100) / 100,
      omschrijving: omschrijvingen.join(', '),
    };
  }

  function voegToeAanCart(product, selecties, aantal){
    var berekend = berekenPrijsEnOmschrijving(product, selecties);
    var sleutel = sleutelVoorRegel(product.id, selecties);
    var bestaande = cart.find(function(r){ return r.sleutel === sleutel; });
    if (bestaande) {
      bestaande.aantal += aantal;
    } else {
      cart.push({
        sleutel: sleutel,
        id: product.id,
        naam: product.naam,
        extras: selecties,
        extraOmschrijving: berekend.omschrijving,
        prijsPerStuk: berekend.prijsPerStuk,
        aantal: aantal,
      });
    }
    tekenCart();
  }

  function tekenCart(){
    var host = document.getElementById('cartLijst');
    if (cart.length === 0) {
      host.innerHTML = '<div class="leegCart">Nog niets toegevoegd.</div>';
    } else {
      host.innerHTML = '';
      cart.forEach(function(regel){
        var subtotaal = Math.round(regel.prijsPerStuk * regel.aantal * 100) / 100;
        var div = document.createElement('div');
        div.className = 'cartRegel';
        div.innerHTML =
          '<div class="info">' +
            '<div class="naam">' + regel.naam + '</div>' +
            (regel.extraOmschrijving ? '<div class="extras">' + regel.extraOmschrijving + '</div>' : '') +
            '<div class="stepper">' +
              '<button type="button" class="min">-</button>' +
              '<span>' + regel.aantal + '</span>' +
              '<button type="button" class="plus">+</button>' +
            '</div>' +
            '<button type="button" class="verwijder">Verwijderen</button>' +
          '</div>' +
          '<div class="subtotaal">' + euro(subtotaal) + '</div>';
        div.querySelector('.min').addEventListener('click', function(){
          regel.aantal -= 1;
          if (regel.aantal <= 0) cart = cart.filter(function(r){ return r !== regel; });
          tekenCart();
        });
        div.querySelector('.plus').addEventListener('click', function(){ regel.aantal += 1; tekenCart(); });
        div.querySelector('.verwijder').addEventListener('click', function(){
          cart = cart.filter(function(r){ return r !== regel; });
          tekenCart();
        });
        host.appendChild(div);
      });
    }
    var totaal = cart.reduce(function(s, r){ return s + Math.round(r.prijsPerStuk * r.aantal * 100) / 100; }, 0);
    totaal = Math.round(totaal * 100) / 100;
    document.getElementById('totaalBedrag').textContent = euro(totaal);
    document.getElementById('afrekenBtn').disabled = cart.length === 0;
    tekenLoyaliteitKorting(totaal);
  }

  // --- Extras-modal: grote keuzeknoppen i.p.v. radio/checkbox ---
  // Ondersteunt zowel single-select groepen (max 1, radiogedrag: kiezen
  // vervangt de vorige keuze in die groep) als multi-select groepen (max N,
  // togglegedrag: elke knop schakelt onafhankelijk aan/uit, tot het max
  // bereikt is). modalSelecties heeft de vorm { groepId: [optieIndex, ...] }.
  var modalProduct = null;
  var modalAantal = 1;
  var modalSelecties = {};
  var overlay = document.getElementById('modalOverlay');

  function groepLabel(groep){
    if (groep.min >= 1) {
      return groep.max > 1 ? ' (verplicht, kies 1-' + groep.max + ')' : ' (verplicht)';
    }
    return groep.max > 1 ? ' (optioneel, kies tot ' + groep.max + ')' : ' (optioneel)';
  }

  function openModal(product){
    modalProduct = product;
    modalAantal = 1;
    modalSelecties = {};
    document.getElementById('modalProductNaam').textContent = product.naam;
    document.getElementById('modalAantal').textContent = '1';
    document.getElementById('modalMelding').textContent = '';
    var host = document.getElementById('modalExtrasHost');
    host.innerHTML = '';
    product.kassaExtras.forEach(function(groep){
      modalSelecties[groep.id] = [];
      var wrap = document.createElement('div');
      wrap.className = 'extraGroep';
      var titel = document.createElement('div');
      titel.className = 'groepnaam';
      titel.textContent = groep.naam + groepLabel(groep);
      wrap.appendChild(titel);
      var optiesHost = document.createElement('div');
      optiesHost.className = 'opties';
      groep.opties.forEach(function(optie, idx){
        var btn = document.createElement('button');
        btn.type = 'button';
        btn.className = 'optieBtn';
        btn.innerHTML = optie.naam + (optie.prijs > 0 ? '<span class="optiePrijs">+' + euro(optie.prijs) + '</span>' : '');
        btn.addEventListener('click', function(){
          var huidig = modalSelecties[groep.id] || [];
          var alGeselecteerd = huidig.indexOf(idx) !== -1;
          if (groep.max <= 1) {
            // single-select: nogmaals tikken op de gekozen optie zet 'm uit;
            // een nieuwe keuze vervangt altijd de vorige in deze groep.
            modalSelecties[groep.id] = alGeselecteerd ? [] : [idx];
          } else if (alGeselecteerd) {
            modalSelecties[groep.id] = huidig.filter(function(i){ return i !== idx; });
          } else if (huidig.length < groep.max) {
            modalSelecties[groep.id] = huidig.concat([idx]);
          } else {
            return; // max bereikt: negeer extra klik
          }
          optiesHost.querySelectorAll('.optieBtn').forEach(function(b, i2){
            b.classList.toggle('geselecteerd', modalSelecties[groep.id].indexOf(i2) !== -1);
          });
        });
        optiesHost.appendChild(btn);
      });
      wrap.appendChild(optiesHost);
      host.appendChild(wrap);
    });
    overlay.classList.add('actief');
  }
  function sluitModal(){ overlay.classList.remove('actief'); modalProduct = null; modalSelecties = {}; }

  document.getElementById('modalAnnulerenBtn').addEventListener('click', sluitModal);
  document.getElementById('modalMin').addEventListener('click', function(){
    if (modalAantal > 1) { modalAantal -= 1; document.getElementById('modalAantal').textContent = modalAantal; }
  });
  document.getElementById('modalPlus').addEventListener('click', function(){
    modalAantal += 1; document.getElementById('modalAantal').textContent = modalAantal;
  });

  document.getElementById('modalToevoegenBtn').addEventListener('click', function(){
    if (!modalProduct) return;
    var fout = null;
    modalProduct.kassaExtras.forEach(function(groep){
      if (fout) return;
      var aantalGeselecteerd = (modalSelecties[groep.id] || []).length;
      if (aantalGeselecteerd < (groep.min || 0)) {
        fout = 'Kies minimaal ' + (groep.min || 1) + ' optie(s) bij "' + groep.naam + '".';
      } else if (aantalGeselecteerd > groep.max) {
        fout = 'Te veel keuzes bij "' + groep.naam + '".';
      }
    });
    if (fout) {
      document.getElementById('modalMelding').textContent = fout;
      return;
    }
    voegToeAanCart(modalProduct, modalSelecties, modalAantal);
    sluitModal();
  });

  // --- Loyaliteit koppelen ---
  var loyaliteitAccount = null; // { code, zegels, restBedrag, beschikbareKorting }

  document.getElementById('loyZoekBtn').addEventListener('click', function(){
    var code = document.getElementById('loyCode').value.trim();
    var melding = document.getElementById('loyMelding');
    if (!code) { melding.textContent = 'Voer een code in.'; melding.className = 'melding fout'; return; }
    melding.textContent = 'Zoeken...';
    melding.className = 'melding';
    fetch('/api/loyalty-opzoeken?wachtwoord=' + encodeURIComponent(huidigWachtwoord) + '&code=' + encodeURIComponent(code))
      .then(function(res){ return res.json().then(function(d){ return {ok:res.ok, data:d}; }); })
      .then(function(result){
        if (!result.ok) {
          melding.textContent = (result.data && result.data.error) || 'Kon spaarkaart niet vinden.';
          melding.className = 'melding fout';
          loyaliteitAccount = null;
          document.getElementById('loyKlantkaart').style.display = 'none';
          tekenCart();
          return;
        }
        melding.textContent = '';
        var acc = result.data.account;
        loyaliteitAccount = { code: acc.code, zegels: acc.zegels, restBedrag: acc.rest_bedrag, beschikbareKorting: acc.beschikbare_korting };
        tekenKlantkaart();
        tekenCart();
      })
      .catch(function(){ melding.textContent = 'Kon geen verbinding maken.'; melding.className = 'melding fout'; });
  });

  function tekenKlantkaart(){
    var host = document.getElementById('loyKlantkaart');
    if (!loyaliteitAccount) { host.style.display = 'none'; return; }
    host.style.display = 'block';
    host.innerHTML =
      '<div class="klantkaart">' +
        '<div class="rij"><span>Zegels</span><strong>' + loyaliteitAccount.zegels + ' / 20</strong></div>' +
        '<div class="rij"><span>Beschikbare korting</span><strong>' + euro(loyaliteitAccount.beschikbareKorting) + '</strong></div>' +
        (loyaliteitAccount.beschikbareKorting > 0
          ? '<label style="margin-top:.6rem">Korting nu verzilveren</label><input type="number" id="loyKortingInput" step="0.01" min="0">'
          : '') +
        '<button type="button" class="klein" id="loyOntkoppelBtn" style="margin-top:.4rem">Loskoppelen</button>' +
      '</div>';
    if (loyaliteitAccount.beschikbareKorting > 0) {
      var input = document.getElementById('loyKortingInput');
      input.addEventListener('input', function(){ tekenCart(); });
    }
    document.getElementById('loyOntkoppelBtn').addEventListener('click', function(){
      loyaliteitAccount = null;
      document.getElementById('loyCode').value = '';
      host.style.display = 'none';
      tekenCart();
    });
  }

  function gewensteKorting(totaal){
    if (!loyaliteitAccount || loyaliteitAccount.beschikbareKorting <= 0) return 0;
    var input = document.getElementById('loyKortingInput');
    var gewenst = input ? parseFloat(input.value) : loyaliteitAccount.beschikbareKorting;
    if (!Number.isFinite(gewenst)) gewenst = loyaliteitAccount.beschikbareKorting;
    gewenst = Math.max(0, Math.min(gewenst, loyaliteitAccount.beschikbareKorting, totaal));
    return Math.round(gewenst * 100) / 100;
  }

  function tekenLoyaliteitKorting(totaal){
    // Toont geen apart kortingsbedrag-veld in de totaalregel (de server bepaalt
    // het echte te betalen bedrag pas bij het afrekenen), maar houdt het
    // ingevulde kortingsbedrag netjes binnen de grenzen als het totaal wijzigt.
    var input = document.getElementById('loyKortingInput');
    if (input && loyaliteitAccount) {
      var max = Math.min(loyaliteitAccount.beschikbareKorting, totaal);
      if (!input.value) input.value = max.toFixed(2);
    }
  }

  // --- Levering: Afhalen/Bezorgen-toggle (juli 2026) ---
  // 'Aan de deur betalen' bestaat alleen nog hier, achter het
  // personeelswachtwoord - niet meer op de openbare bestelsite (zie
  // order.js en bestellen.html). Bij 'bezorgen' worden adresvelden getoond
  // en verplicht; /api/kassa-order doet daarna zelf de bezorgzone-check
  // (Mapbox) en berekent de bezorgkosten, exact zoals de website dat deed.
  var huidigeLevering = 'kassa';
  document.querySelectorAll('.levering-keuze-btn').forEach(function(btn){
    btn.addEventListener('click', function(){
      huidigeLevering = btn.dataset.levering;
      document.querySelectorAll('.levering-keuze-btn').forEach(function(b){ b.classList.toggle('actief', b === btn); });
      document.getElementById('bezorgVeldenKassa').style.display = huidigeLevering === 'bezorgen' ? 'block' : 'none';
      document.getElementById('bezorgKassaMelding').textContent = '';
    });
  });

  function resetLeveringKeuze(){
    huidigeLevering = 'kassa';
    document.querySelectorAll('.levering-keuze-btn').forEach(function(b){ b.classList.toggle('actief', b.dataset.levering === 'kassa'); });
    document.getElementById('bezorgVeldenKassa').style.display = 'none';
    document.getElementById('kassaBezorgNaam').value = '';
    document.getElementById('kassaBezorgTelefoon').value = '';
    document.getElementById('kassaBezorgAdres').value = '';
    document.getElementById('kassaBezorgPostcode').value = '';
    document.getElementById('kassaBezorgPlaats').value = 'Veenendaal';
    document.getElementById('bezorgKassaMelding').textContent = '';
  }

  // --- Afrekenen ---
  document.getElementById('afrekenBtn').addEventListener('click', function(){
    var melding = document.getElementById('afrekenMelding');
    var bezorgMelding = document.getElementById('bezorgKassaMelding');
    if (cart.length === 0) return;
    var totaal = cart.reduce(function(s, r){ return s + Math.round(r.prijsPerStuk * r.aantal * 100) / 100; }, 0);
    totaal = Math.round(totaal * 100) / 100;

    var body = {
      wachtwoord: huidigWachtwoord,
      items: cart.map(function(r){ return { id: r.id, aantal: r.aantal, extras: r.extras }; }),
    };
    if (loyaliteitAccount) {
      body.loyaliteitsCode = loyaliteitAccount.code;
      body.kortingGebruikt = gewensteKorting(totaal);
    }

    if (huidigeLevering === 'bezorgen') {
      var naam = document.getElementById('kassaBezorgNaam').value.trim();
      var telefoon = document.getElementById('kassaBezorgTelefoon').value.trim();
      var adres = document.getElementById('kassaBezorgAdres').value.trim();
      var postcode = document.getElementById('kassaBezorgPostcode').value.trim();
      var plaats = document.getElementById('kassaBezorgPlaats').value.trim();
      if (!naam || !telefoon || !adres || !postcode || !plaats) {
        bezorgMelding.textContent = 'Vul naam, telefoon, adres, postcode en plaats in voor een bezorgorder.';
        return;
      }
      bezorgMelding.textContent = '';
      body.levering = 'bezorgen';
      body.customer = { naam: naam, telefoon: telefoon, adres: adres, postcode: postcode, plaats: plaats };
    }

    melding.textContent = '';
    document.getElementById('afrekenBtn').disabled = true;

    fetch('/api/kassa-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(body),
    })
      .then(function(res){ return res.json().then(function(d){ return {ok:res.ok, data:d}; }); })
      .then(function(result){
        document.getElementById('afrekenBtn').disabled = cart.length === 0;
        if (!result.ok) {
          if (huidigeLevering === 'bezorgen') {
            bezorgMelding.textContent = (result.data && result.data.error) || 'Kon de bezorgorder niet verwerken.';
          } else {
            melding.textContent = (result.data && result.data.error) || 'Kon de verkoop niet verwerken.';
          }
          return;
        }
        if (huidigeLevering === 'bezorgen') {
          toonBezorgBevestiging(result.data);
        } else {
          toonBetaalKeuze(result.data);
        }
      })
      .catch(function(){
        melding.textContent = 'Kon geen verbinding maken.';
        document.getElementById('afrekenBtn').disabled = cart.length === 0;
      });
  });

  // --- Pin/contant-keuze + numpad met wisselgeldberekening ---
  // De verkoop staat op dit punt al vast (kassa-order.js is al succesvol
  // aangeroepen) — deze schermen bepalen alleen hoe het personeel het
  // bedrag laat zien/uitrekent, niets hiervan raakt de database. De
  // keuze + het numpad blijven zichtbaar in de winkelwagen-kolom (naast
  // producten en winkelwagen); alleen het eindresultaat (te pinnen bedrag
  // of wisselgeld) krijgt nog een groot scherm via #betaalOverlay.
  var betaalTotaal = 0;
  var numpadCents = 0;
  var laatsteLoyaliteitTekst = '';

  function resetBetaalInline(){
    document.getElementById('inlineKeuze').style.display = '';
    document.getElementById('inlineContant').style.display = 'none';
  }

  function bijwerkenLoyaliteitTekst(data){
    if (data.loyaliteit && !data.loyaliteit.fout) {
      var extra = data.loyaliteit.kortingErbij > 0 ? ' Er is €5 korting bijgeschreven omdat 20 zegels bereikt zijn!' : '';
      laatsteLoyaliteitTekst = '+' + data.loyaliteit.zegelsErbij + ' zegel(s) toegekend (' + data.loyaliteit.zegelsNieuw + '/20).' + extra;
    } else if (data.loyaliteit && data.loyaliteit.fout) {
      laatsteLoyaliteitTekst = data.loyaliteit.fout;
    } else {
      laatsteLoyaliteitTekst = '';
    }
  }

  function toonBetaalKeuze(data){
    betaalTotaal = Number(data.totaal) || 0;
    bijwerkenLoyaliteitTekst(data);
    document.getElementById('betaalLoyaliteitInfo').textContent = laatsteLoyaliteitTekst;
    resetBetaalInline();
    document.getElementById('afrekenBtn').style.display = 'none';
    document.getElementById('betaalInline').style.display = 'block';
  }

  // Bezorgorder ('aan de deur betalen'): de order staat al vast in D1 (status
  // 'paid', betaalmethode 'aan_de_deur', betaalstatus 'onbetaald') en komt
  // vanzelf tussen de openstaande bezorgorders terecht (kassa-ritten.html /
  // kassa-bezorger.html "Zelf orders kiezen"). Hier aan de balie is er dus
  // niets meer te pinnen/contant te ontvangen - alleen een bevestiging tonen,
  // met het bedrag dat de bezorger straks aan de deur ophaalt.
  function toonBezorgBevestiging(data){
    bijwerkenLoyaliteitTekst(data);
    document.getElementById('afrekenBtn').style.display = 'none';
    toonBetaalEind('Bezorgorder ' + data.orderId + ' — aan de deur betalen', data.totaal);
  }

  function toonBetaalEind(label, bedrag){
    document.getElementById('betaalEindLabel').textContent = label;
    document.getElementById('betaalEindBedrag').textContent = euro(bedrag);
    document.getElementById('betaalOverlayLoyaliteitInfo').textContent = laatsteLoyaliteitTekst;
    document.getElementById('betaalOverlay').classList.add('actief');
  }

  document.getElementById('kiesPinBtn').addEventListener('click', function(){
    toonBetaalEind('Te pinnen', betaalTotaal);
  });

  document.getElementById('kiesContantBtn').addEventListener('click', function(){
    numpadCents = 0;
    tekenNumpad();
    bouwNumpadSnelknoppen();
    document.getElementById('inlineKeuze').style.display = 'none';
    document.getElementById('inlineContant').style.display = 'block';
  });

  document.getElementById('contantTerugBtn').addEventListener('click', function(){
    resetBetaalInline();
  });

  function bouwNumpadSnelknoppen(){
    var host = document.getElementById('numpadSnelHost');
    host.innerHTML = '';
    var passendCents = Math.round(betaalTotaal * 100);
    var briefjes = [passendCents, 500, 1000, 2000, 5000];
    // Uniek houden en alleen briefjes tonen die zinnig zijn (>= totaal, of het passende bedrag zelf).
    var gezien = {};
    briefjes.forEach(function(cents){
      if (cents <= 0 || gezien[cents]) return;
      gezien[cents] = true;
      var btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = cents === passendCents ? 'Precies (' + euro(cents / 100) + ')' : euro(cents / 100);
      btn.addEventListener('click', function(){
        numpadCents = cents;
        tekenNumpad();
      });
      host.appendChild(btn);
    });
  }

  function tekenNumpad(){
    document.getElementById('numpadWeergave').textContent = euro(numpadCents / 100);
    var wisselRij = document.getElementById('wisselgeldRij');
    var wisselgeld = Math.round((numpadCents / 100 - betaalTotaal) * 100) / 100;
    var bevestigBtn = document.getElementById('contantBevestigBtn');
    if (numpadCents === 0) {
      wisselRij.textContent = 'Totaal: ' + euro(betaalTotaal);
      wisselRij.classList.add('nogNiet');
      bevestigBtn.disabled = true;
    } else if (wisselgeld < 0) {
      wisselRij.textContent = 'Nog €' + Math.abs(wisselgeld).toFixed(2).replace('.', ',') + ' te weinig';
      wisselRij.classList.add('nogNiet');
      bevestigBtn.disabled = true;
    } else {
      wisselRij.textContent = 'Wisselgeld: ' + euro(wisselgeld);
      wisselRij.classList.remove('nogNiet');
      bevestigBtn.disabled = false;
    }
  }

  document.querySelector('.numpad').addEventListener('click', function(e){
    var btn = e.target.closest('button[data-cijfer]');
    if (!btn) return;
    // Cap op €999,99 zodat je niet per ongeluk een absurd bedrag opbouwt.
    var nieuw = numpadCents * 10 + Number(btn.dataset.cijfer);
    if (nieuw <= 99999) numpadCents = nieuw;
    tekenNumpad();
  });
  document.getElementById('numpadWisBtn').addEventListener('click', function(){
    numpadCents = 0;
    tekenNumpad();
  });
  document.getElementById('numpadBackBtn').addEventListener('click', function(){
    numpadCents = Math.floor(numpadCents / 10);
    tekenNumpad();
  });

  document.getElementById('contantBevestigBtn').addEventListener('click', function(){
    var wisselgeld = Math.round((numpadCents / 100 - betaalTotaal) * 100) / 100;
    if (wisselgeld < 0) return;
    toonBetaalEind('Wisselgeld', wisselgeld);
  });

  document.getElementById('volgendeKlantBtn').addEventListener('click', function(){
    cart = [];
    loyaliteitAccount = null;
    document.getElementById('loyCode').value = '';
    document.getElementById('loyKlantkaart').style.display = 'none';
    document.getElementById('loyMelding').textContent = '';
    document.getElementById('afrekenMelding').textContent = '';
    resetLeveringKeuze();
    tekenCart();
    document.getElementById('betaalOverlay').classList.remove('actief');
    document.getElementById('betaalInline').style.display = 'none';
    document.getElementById('afrekenBtn').style.display = '';
    resetBetaalInline();
  });
})();
</script>
</body>
</html>
